<!-- 服务管理页面 -->
<div class="cluster-services-page">
    <style>
        @import url('/plugins/cluster/static/css/cluster.css');
    </style>
    
    <div class="cluster-header">
        <h2>
            <i class="layui-icon layui-icon-util"></i> 服务管理 - <span id="serviceNodeName"></span>
        </h2>
        <button class="layui-btn layui-btn-sm" onclick="history.back()">
            <i class="layui-icon layui-icon-return"></i> 返回
        </button>
    </div>

    <div class="layui-tab layui-tab-brief" lay-filter="serviceTab">
        <ul class="layui-tab-title">
            <li class="layui-this">服务管理</li>
            <li>自启动管理</li>
            <li>数据库配置</li>
            <li>子面板设置</li>
        </ul>
        <div class="layui-tab-content">
            <!-- 服务管理 -->
            <div class="layui-tab-item layui-show">
                <table class="layui-table" id="serviceTable">
                    <thead>
                        <tr>
                            <th>服务名称</th>
                            <th>当前状态</th>
                            <th>端口</th>
                            <th>版本</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="serviceTableBody">
                    </tbody>
                </table>
                <div class="service-add-area">
                    <select id="newServiceSelect" class="layui-input layui-input-sm" style="width:200px;display:inline-block;">
                        <option value="">选择要添加的服务...</option>
                    </select>
                    <button class="layui-btn layui-btn-sm layui-btn-normal" onclick="addServiceToNode()">
                        <i class="layui-icon layui-icon-add-1"></i> 添加服务
                    </button>
                </div>
            </div>

            <!-- 自启动管理 -->
            <div class="layui-tab-item">
                <table class="layui-table" id="autoStartTable">
                    <thead>
                        <tr>
                            <th>服务名称</th>
                            <th>自启动状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="autoStartTableBody">
                    </tbody>
                </table>
            </div>

            <!-- 数据库配置 -->
            <div class="layui-tab-item">
                <div class="db-config-form">
                    <h3>主服务数据库配置</h3>
                    <p class="form-tip">使用已安装的 PostgreSQL、MySQL、MariaDB 进行手动配置</p>
                    
                    <form class="layui-form" id="dbConfigForm">
                        <input type="hidden" id="dbNodeId">
                        <div class="layui-form-item">
                            <label class="layui-form-label">数据库类型</label>
                            <div class="layui-input-block">
                                <select id="dbType" lay-filter="dbType">
                                    <option value="mysql">MySQL</option>
                                    <option value="mariadb">MariaDB</option>
                                    <option value="postgresql">PostgreSQL</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">主机地址</label>
                            <div class="layui-input-block">
                                <input type="text" id="dbHost" class="layui-input" value="127.0.0.1">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">端口</label>
                            <div class="layui-input-block">
                                <input type="number" id="dbPort" class="layui-input" value="3306">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">数据库名</label>
                            <div class="layui-input-block">
                                <input type="text" id="dbName" class="layui-input" placeholder="mw_panel">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">用户名</label>
                            <div class="layui-input-block">
                                <input type="text" id="dbUser" class="layui-input" placeholder="root">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">密码</label>
                            <div class="layui-input-block">
                                <input type="password" id="dbPassword" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">表前缀</label>
                            <div class="layui-input-block">
                                <input type="text" id="dbPrefix" class="layui-input" value="mw_">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button type="button" class="layui-btn layui-btn-normal" onclick="saveDbConfig()">
                                    <i class="layui-icon layui-icon-ok"></i> 保存配置
                                </button>
                                <button type="button" class="layui-btn layui-btn-warm" onclick="testDbConnection()">
                                    <i class="layui-icon layui-icon-link"></i> 测试连接
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 子面板设置 -->
            <div class="layui-tab-item">
                <div class="sub-panel-settings">
                    <h3>子面板服务设置</h3>
                    <p class="form-tip">配置子面板的各项参数</p>
                    
                    <form class="layui-form" id="subPanelForm">
                        <div class="layui-form-item">
                            <label class="layui-form-label">面板名称</label>
                            <div class="layui-input-block">
                                <input type="text" id="subPanelName" class="layui-input" 
                                       placeholder="子面板显示名称">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">面板端口</label>
                            <div class="layui-input-block">
                                <input type="number" id="subPanelPort" class="layui-input" 
                                       placeholder="7200" value="7200">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">面板域名</label>
                            <div class="layui-input-block">
                                <input type="text" id="subPanelDomain" class="layui-input" 
                                       placeholder="可选，绑定域名">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">SSL</label>
                            <div class="layui-input-block">
                                <input type="checkbox" id="subPanelSSL" lay-skin="switch" lay-text="开启|关闭">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">面板入口</label>
                            <div class="layui-input-block">
                                <input type="text" id="subPanelEntrance" class="layui-input" 
                                       placeholder="/admin" value="/admin">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">最大连接数</label>
                            <div class="layui-input-block">
                                <input type="number" id="subPanelMaxConn" class="layui-input" 
                                       placeholder="100" value="100">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button type="button" class="layui-btn layui-btn-normal" onclick="saveSubPanelConfig()">
                                    <i class="layui-icon layui-icon-ok"></i> 保存设置
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/plugins/cluster/static/js/cluster.js"></script>
